name: Publish
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  publish_npm:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare repository
        run: git checkout main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install monorepo deps
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm exec vp run build:packages
      - name: Generate type stubs
        run: pnpm exec turbo run type-stubs --filter=@clarigen/cli
      - name: Check
        run: pnpm exec vp check
      - name: Type checks
        run: pnpm exec vp run typecheck
      - name: Tests
        run: pnpm exec vp run test
      # - name: Stash changes
      #   run: git stash
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm exec vp run publish-changesets
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
